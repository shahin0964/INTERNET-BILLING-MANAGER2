name: Build and Update Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21 (Latest LTS)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Compute Dynamic Version
        run: |
          VERSION_CODE=${{ github.run_number }}
          VERSION_NAME="1.0.${{ github.run_number }}"
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV

      - name: Build Android APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug -PversionCode=${{ env.VERSION_CODE }} -PversionName=${{ env.VERSION_NAME }} --stacktrace 2>&1 | tee build_log.txt

      - name: Push Error Log on Failure
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B build-log
          cp build_log.txt BUILD_ERROR.txt
          git add -f BUILD_ERROR.txt
          git commit -m "Auto-capture Gradle build error" || true
          git push origin build-log -f || true

      - name: Prepare APK for Release
        run: |
          mkdir -p release-artifacts
          echo "=== Searching for generated APK ==="
          find . -type f -name "*.apk" || true
          APK_FILE=$(find . -type f -name "*.apk" 2>/dev/null | head -n 1)
          echo "Found APK: $APK_FILE"
          if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
            cp "$APK_FILE" release-artifacts/IBM-latest.apk
            cp "$APK_FILE" "release-artifacts/IBM-v${{ env.VERSION_NAME }}.apk"
            echo "Successfully prepared release artifacts"
            ls -lh release-artifacts/
          else
            echo "::error::No APK file found in workspace after build!"
            exit 1
          fi

      - name: Update GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: "v${{ env.VERSION_NAME }}"
          commit: ${{ github.sha }}
          name: "v${{ env.VERSION_NAME }}"
          body: |
            ## 📱 INTERNET BILLING MANAGER (IBM)
            **সর্বশেষ রিলিজ (v${{ env.VERSION_NAME }})**

            এই রিলিজটি প্রতিটি আপডেটে স্বয়ংক্রিয়ভাবে প্রতিস্থাপন ও আপডেট করা হয়। নিচের লিঙ্ক থেকে সরাসরি লেটেস্ট APK ফাইলটি ডাউনলোড করে ফোনে ইনস্টল করতে পারবেন।

            ### 📋 বিল্ড বিবরণ:
            - **App Name**: INTERNET BILLING MANAGER
            - **Short / Launcher Name**: `IBM`
            - **App Version**: `v${{ env.VERSION_NAME }}` (Build #${{ env.VERSION_CODE }})
            - **Package**: `internet.billing.manager`
            - **Java / JDK Version**: JDK 21 (Latest LTS)
            - **Gradle & Kotlin Toolchain**: Latest (Kotlin 2.0.21, Compose 2024.10, AGP 8.7)
            - **সর্বশেষ আপডেট**: ${{ github.event.head_commit.timestamp }}
            - **কমিট**: [${{ github.sha }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
            - **কমিট বার্তা**: ${{ github.event.head_commit.message }}

            ---
            ### 📥 ডাউনলোড লিঙ্ক:
            নিচের **`IBM-latest.apk`** বা **`IBM-v${{ env.VERSION_NAME }}.apk`** ফাইলে ক্লিক করে ডাউনলোড ও ইনস্টল করুন।
          artifacts: "release-artifacts/*"
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}
